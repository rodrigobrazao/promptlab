<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>A GERAÇÃO DIVIDIDA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: 'Roboto Mono', monospace;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script>
// ============================================================
// A GERAÇÃO DIVIDIDA — experiência interactiva
// Estrutura: 0 start · 1..8 secções · 9 fim
// Dados fictícios — substituir nos blocos DATA.* no fim do ficheiro
// ============================================================

// --- ESTADO GLOBAL ---
let section = 0;            // 0 start, 1..8 secções, 9 fim
let sectionTimer = 0;
let transitioning = false;
let transitionT = 0;
let canAdvance = false;

// Perfil que cresce silenciosamente
const profile = {
  quadrant: { x: 0, y: 0 },   // 01 · -1..1 esq/dir, -1..1 lib/aut
  gender: null,                // 02 · 'M' | 'F'
  regionIdx: null,             // 03 · índice em DATA.regions
  feedBias: null,              // 04 · chave em DATA.feedThemes
  feedTimes: {},               // 04 · tempo por tema
  agreements: [],              // 05 · 0..1 cada (concordância com 6 afirmações)
  conservativeScore: 0,        // 05 · contagem de concordâncias conservadoras
  clusterIdx: null,            // 07 · cluster atribuído
  clusterMatch: 0              // 07 · % sobreposição
};

// Áudio
let audioCtx, masterGain, panNode;
let drones = [];
let ambientOn = false;
let currentPan = 0; // -1 esquerda, +1 direita

// Viewport 9:16
let vx, vy, vw, vh;
const VIEWPORT_RATIO = 9 / 16;

function calculateViewport() {
  const target = VIEWPORT_RATIO;
  const sr = windowWidth / windowHeight;
  if (sr > target) {
    vh = windowHeight; vw = vh * target;
    vx = (windowWidth - vw) / 2; vy = 0;
  } else {
    vw = windowWidth; vh = vw / target;
    vx = 0; vy = (windowHeight - vh) / 2;
  }
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  textFont('Roboto Mono');
  textWrap(WORD);
  textLeading(28);
  calculateViewport();
  initSection(0);
}

// helpers de tipografia (escala com viewport)
function ts(rel)    { return min(vw, vh) * rel; }
function setText(rel, leadingRel) {
  textSize(ts(rel));
  textLeading(ts(leadingRel || rel * 1.35));
}
// caixa de texto com wrap e altura limitada (centrada no y)
function textBlock(str, cx, cy, wRatio, sizeRel, leadingRel, alpha) {
  const w = vw * (wRatio || 0.82);
  push();
  noStroke();
  fill(255, alpha === undefined ? 255 : alpha);
  textAlign(CENTER, CENTER);
  setText(sizeRel, leadingRel);
  text(str, cx - w / 2, cy - ts(sizeRel) * 1.6, w, ts(sizeRel) * 4);
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  calculateViewport();
  initSection(section);
}

// ============================================================
// DRAW
// ============================================================

function draw() {
  background(0);
  push();
  translate(vx, vy);
  drawingContext.save();
  drawingContext.beginPath();
  drawingContext.rect(0, 0, vw, vh);
  drawingContext.clip();

  if (transitioning) {
    drawTransition();
  } else {
    switch (section) {
      case 0: drawStart(); break;
      case 1: drawSec1(); break;
      case 2: drawSec2(); break;
      case 3: drawSec3(); break;
      case 4: drawSec4(); break;
      case 5: drawSec5(); break;
      case 6: drawSec6(); break;
      case 7: drawSec7(); break;
      case 8: drawSec8(); break;
      case 9: drawEnd(); break;
    }
    if (section >= 1 && section <= 8) drawProgress();
  }

  drawingContext.restore();
  pop();
}

function drawProgress() {
  noStroke();
  const total = 8;
  const w = vw * 0.5;
  const x0 = (vw - w) / 2;
  const y0 = vh - 24;
  for (let i = 0; i < total; i++) {
    fill(255, i < section ? 200 : 40);
    const x = x0 + (w / total) * i;
    rect(x + 2, y0, (w / total) - 4, 1);
  }
  if (canAdvance) {
    fill(255, 100 + sin(frameCount * 0.05) * 80);
    textAlign(CENTER, CENTER);
    textSize(min(vw, vh) * 0.018);
    text("TOCA PARA CONTINUAR", vw / 2, vh - 44);
  }
}

function drawTransition() {
  transitionT += 0.04;
  fill(0, 255 * min(transitionT, 1));
  noStroke();
  rect(0, 0, vw, vh);
  if (transitionT >= 1) {
    transitioning = false;
    transitionT = 0;
    section++;
    canAdvance = false;
    sectionTimer = 0;
    initSection(section);
  }
}

function nextSection() {
  transitioning = true;
  transitionT = 0;
}

// ============================================================
// SECÇÃO 0 · START
// ============================================================

let startProgress = 0;
let startReady = false;
let startClicked = false;
let startClickT = 0;

function initStart() {
  startProgress = 0;
  startReady = false;
  startClicked = false;
  startClickT = 0;
}

function drawStart() {
  const cx = vw / 2, cy = vh / 2;
  const r = min(vw, vh) * 0.08;

  if (startClicked) {
    startClickT += deltaTime;
    if (startClickT < 400) {
      noStroke(); fill(255);
      ellipse(cx, cy, r * 2 * (1 + (startClickT / 400) * 0.2));
      return;
    }
    if (startClickT < 1800) {
      background(0);
      return;
    }
    section = 1;
    canAdvance = false;
    sectionTimer = 0;
    initSection(1);
    return;
  }

  if (!startReady) {
    startProgress += deltaTime / 2200;
    if (startProgress >= 1) { startProgress = 1; startReady = true; playReadyTone(); }
  }

  stroke(255); strokeWeight(2); noFill();
  if (!startReady) {
    arc(cx, cy, r * 2, r * 2, -HALF_PI, -HALF_PI + startProgress * TWO_PI);
  } else {
    const pulse = 1 + sin(millis() * 0.003) * 0.05;
    ellipse(cx, cy, r * 2 * pulse);
    noStroke(); fill(255);
    textAlign(CENTER, CENTER);
    textSize(min(vw, vh) * 0.024);
    text("A GERAÇÃO DIVIDIDA", cx, cy + r + 40);
    textSize(min(vw, vh) * 0.014);
    fill(255, 120);
    text("toca para começar", cx, cy + r + 70);
  }
}

function handleStartClick(x, y) {
  if (!startReady || startClicked) return;
  const cx = vw / 2, cy = vh / 2;
  if (dist(x, y, cx, cy) < min(vw, vh) * 0.12) {
    startClicked = true;
    ensureAudio();
    playClickTone();
    startAmbient();
  }
}

// ============================================================
// SECÇÃO 1 · O PONTO  (quadrante oculto)
// ============================================================

let s1_point = null;
let s1_locked = false;
let s1_lockT = 0;

function initSec1() {
  s1_point = { x: vw / 2, y: vh / 2 };
  s1_locked = false;
  s1_lockT = 0;
}

function drawSec1() {
  sectionTimer += deltaTime;
  const cx = vw / 2, cy = vh / 2;

  // tag secção (topo)
  drawSectionTag("01");

  if (!s1_locked) {
    // instrução topo
    textAlign(CENTER, CENTER); noStroke();
    fill(255, 160); setText(0.018);
    text("arrasta para onde te sentes", cx, vh * 0.18);

    // ponto pulsante (no início no centro; user arrasta)
    const pulse = sin(frameCount * 0.05) * 0.3 + 0.7;
    fill(255, 255 * pulse); noStroke();
    ellipse(s1_point.x, s1_point.y, 22 * pulse);
  } else {
    // ponto fixo
    fill(255); noStroke();
    ellipse(s1_point.x, s1_point.y, 14);
    s1_lockT += deltaTime;

    // reveal centrado
    const q = readQuadrantLabel(profile.quadrant);
    const pct = quadrantPct(profile.quadrant);
    const a = min(255, (s1_lockT - 300) * 0.7);

    textAlign(CENTER, CENTER); noStroke();
    fill(255, a * 0.7); setText(0.013);
    text(q, cx, cy - ts(0.10));

    fill(255, a); setText(0.11);
    textStyle(BOLD);
    text(pct + "%", cx, cy);
    textStyle(NORMAL);

    fill(255, a * 0.7); setText(0.015, 0.022);
    text("dos jovens portugueses\nestão neste quadrante", cx, cy + ts(0.09));

    if (s1_lockT > 1400) canAdvance = true;
  }
}

function drawSectionTag(label) {
  noStroke();
  textAlign(CENTER, CENTER);
  fill(255, 70); setText(0.012);
  text(label, vw / 2, vh * 0.08);
}

function handleSec1Press(x, y) {
  if (s1_locked) return;
  s1_point.x = x; s1_point.y = y;
}
function handleSec1Drag(x, y) {
  if (s1_locked) return;
  s1_point.x = constrain(x, 40, vw - 40);
  s1_point.y = constrain(y, 80, vh - 80);
}
function handleSec1Release() {
  if (s1_locked) return;
  // converter posição para quadrante -1..1
  profile.quadrant.x = map(s1_point.x, 40, vw - 40, -1, 1);
  profile.quadrant.y = map(s1_point.y, 80, vh - 80, -1, 1);
  s1_locked = true;
  playClickTone();
  updatePanFromProfile();
}

function readQuadrantLabel(q) {
  const h = q.x > 0 ? "direita" : "esquerda";
  const v = q.y > 0 ? "autoritário" : "libertário";
  return (h + " · " + v).toUpperCase();
}

// ============================================================
// SECÇÃO 2 · OS DOIS  (género)
// ============================================================

let s2_chosen = null;
let s2_chosenT = 0;

function initSec2() {
  s2_chosen = null;
  s2_chosenT = 0;
}

function drawSec2() {
  const cx = vw / 2, cy = vh / 2;
  const offset = ts(0.13);
  const r = ts(0.07);

  drawSectionTag("02");

  if (s2_chosen === null) {
    textAlign(CENTER, CENTER); noStroke();
    fill(255, 160); setText(0.018);
    text("qual te representa", cx, vh * 0.18);

    // dois círculos centrados verticalmente
    noFill(); stroke(255); strokeWeight(2);
    fill(255); noStroke(); ellipse(cx - offset, cy, r * 2);
    noFill(); stroke(255); ellipse(cx + offset, cy, r * 2);
  } else {
    s2_chosenT += deltaTime;
    // círculo escolhido sobe um pouco para libertar espaço ao número
    const keepL = (s2_chosen === 'M');
    const tx = cx;
    const ty = cy - ts(0.12);
    if (keepL) { noStroke(); fill(255); ellipse(tx, ty, r * 1.6); }
    else { noFill(); stroke(255); strokeWeight(2); ellipse(tx, ty, r * 1.6); }

    if (s2_chosenT > 400) {
      const pct = profile.gender === 'M' ? DATA.chegaShare.maleU35 : DATA.chegaShare.femaleU35;
      const a = min(255, (s2_chosenT - 400) * 0.8);
      textAlign(CENTER, CENTER); noStroke();

      fill(255, a); setText(0.11);
      textStyle(BOLD);
      text(pct + "%", cx, cy + ts(0.02));
      textStyle(NORMAL);

      fill(255, a * 0.8); setText(0.015, 0.022);
      const lbl = profile.gender === 'M'
        ? "dos homens com menos de 35 anos\nvotou Chega em 2024"
        : "das mulheres com menos de 35 anos\nvotou Chega em 2024";
      text(lbl, cx, cy + ts(0.13));

      if (s2_chosenT > 1500) canAdvance = true;
    }
  }
}

function handleSec2Click(x, y) {
  if (s2_chosen !== null) return;
  const cy = vh / 2 - 40;
  const offset = min(vw, vh) * 0.13;
  const r = min(vw, vh) * 0.07 + 20;
  if (dist(x, y, vw / 2 - offset, cy) < r) {
    s2_chosen = 'M'; profile.gender = 'M'; playClickTone();
  } else if (dist(x, y, vw / 2 + offset, cy) < r) {
    s2_chosen = 'F'; profile.gender = 'F'; playClickTone();
  }
}

// ============================================================
// SECÇÃO 3 · O MAPA  (geografia)
// ============================================================

let s3_dots = [];
let s3_chosen = null;
let s3_chosenT = 0;
let s3_targetIdx = 0;

function initSec3() {
  s3_dots = [];
  s3_chosen = null;
  s3_chosenT = 0;
  // gerar pontos dentro de um rectângulo simulando PT (proporção alta)
  const mapW = vw * 0.55, mapH = vh * 0.5;
  const mx = (vw - mapW) / 2, my = vh * 0.22;
  for (let i = 0; i < DATA.regions.length; i++) {
    const r = DATA.regions[i];
    s3_dots.push({
      x: mx + r.rx * mapW,
      y: my + r.ry * mapH,
      intensity: r.chega
    });
  }
  // alvo = região com maior chega
  s3_targetIdx = 0;
  for (let i = 1; i < DATA.regions.length; i++)
    if (DATA.regions[i].chega > DATA.regions[s3_targetIdx].chega) s3_targetIdx = i;
}

function drawSec3() {
  // mapa centrado, mais comprimido para deixar espaço aos números abaixo
  const mapW = vw * 0.5, mapH = vh * 0.42;
  const mx = (vw - mapW) / 2;
  const my = vh * 0.20;
  const cx = vw / 2;

  drawSectionTag("03");

  textAlign(CENTER, CENTER); noStroke();
  fill(255, 160); setText(0.018);
  text("onde vives", cx, vh * 0.14);

  // contorno
  stroke(255, 70); strokeWeight(1); noFill();
  rect(mx, my, mapW, mapH, 8);

  // pontos (recalcular posições para o novo mapa)
  for (let i = 0; i < DATA.regions.length; i++) {
    const r = DATA.regions[i];
    const x = mx + r.rx * mapW;
    const y = my + r.ry * mapH;
    s3_dots[i].x = x; s3_dots[i].y = y;
    const isTarget = (i === s3_targetIdx);
    const pulse = isTarget ? (sin(frameCount * 0.05) * 0.4 + 0.6) : 1;
    const alpha = map(r.chega, 0, 30, 60, 255) * (s3_chosen === null ? 1 : 0.35);
    noStroke();
    fill(255, alpha);
    ellipse(x, y, (3 + r.chega * 0.18) * pulse);
  }

  if (s3_chosen !== null) {
    s3_chosenT += deltaTime;
    const c = s3_dots[s3_chosen];
    const t = s3_dots[s3_targetIdx];
    noStroke(); fill(255); ellipse(c.x, c.y, 12);
    stroke(255, 200); strokeWeight(1);
    drawingContext.setLineDash([4, 4]);
    line(c.x, c.y, t.x, t.y);
    drawingContext.setLineDash([]);

    if (s3_chosenT > 400) {
      const region = DATA.regions[s3_chosen];
      const target = DATA.regions[s3_targetIdx];
      const distKm = Math.round(dist(c.x, c.y, t.x, t.y) * 1.8);
      const a = min(255, (s3_chosenT - 400) * 0.6);

      // bloco de resultados sob o mapa, com âncoras relativas a vh
      const y0 = my + mapH + ts(0.04);

      noStroke(); textAlign(CENTER, CENTER);
      fill(255, a); setText(0.020);
      textStyle(BOLD);
      text(region.name.toUpperCase(), cx, y0);
      textStyle(NORMAL);

      fill(255, a); setText(0.075);
      textStyle(BOLD);
      text(region.chega + "%", cx, y0 + ts(0.075));
      textStyle(NORMAL);

      fill(255, a * 0.7); setText(0.013, 0.020);
      text("chega no teu concelho · jovens <35", cx, y0 + ts(0.135));

      fill(255, a * 0.55); setText(0.012);
      text(distKm + " km até " + target.name, cx, y0 + ts(0.165));

      if (s3_chosenT > 1500) canAdvance = true;
    }
  }
}

function handleSec3Click(x, y) {
  if (s3_chosen !== null) return;
  let best = -1, bd = 1e9;
  for (let i = 0; i < s3_dots.length; i++) {
    const d = dist(x, y, s3_dots[i].x, s3_dots[i].y);
    if (d < bd && d < 40) { bd = d; best = i; }
  }
  if (best >= 0) {
    s3_chosen = best;
    profile.regionIdx = best;
    playClickTone();
  }
}

// ============================================================
// SECÇÃO 4 · O FEED  (scroll + medição tempo)
// ============================================================

let s4_cards = [];
let s4_offset = 0;
let s4_targetOffset = 0;
let s4_currentIdx = 0;
let s4_lastSwitchTime = 0;
let s4_phase = 'scroll'; // scroll | reveal
let s4_revealT = 0;

function initSec4() {
  s4_cards = [...DATA.feedCards];
  s4_offset = 0; s4_targetOffset = 0;
  s4_currentIdx = 0;
  s4_lastSwitchTime = millis();
  s4_phase = 'scroll';
  s4_revealT = 0;
  profile.feedTimes = {};
  for (const k of Object.keys(DATA.feedThemes)) profile.feedTimes[k] = 0;
  sectionTimer = 0;
}

function drawSec4() {
  sectionTimer += deltaTime;
  s4_offset = lerp(s4_offset, s4_targetOffset, 0.18);

  if (s4_phase === 'scroll') {
    const cardH = vh * 0.62;
    const cardW = vw * 0.82;
    const cx = vw / 2;
    const stepY = cardH * 0.95;

    // desenhar cards próximos
    for (let i = 0; i < s4_cards.length; i++) {
      const cy = vh / 2 + (i * stepY) - s4_offset;
      if (cy < -cardH || cy > vh + cardH) continue;
      const distFromCenter = abs(cy - vh / 2);
      const focus = 1 - constrain(distFromCenter / (stepY * 0.7), 0, 1);

      noStroke();
      fill(255, 10 + 30 * focus);
      rect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 4);

      const c = s4_cards[i];
      // citação centrada com wrap
      noStroke();
      fill(255, 70 + 185 * focus);
      textAlign(CENTER, CENTER);
      setText(0.022, 0.034);
      textStyle(BOLD);
      const tw = cardW - ts(0.05);
      text('"' + c.text + '"', cx - tw / 2, cy - ts(0.08), tw, ts(0.30));
      textStyle(NORMAL);
      // rodapé do card
      setText(0.011);
      fill(255, 50 + 110 * focus);
      text("— anónimo · " + c.year, cx, cy + cardH / 2 - ts(0.03));
    }

    // detectar card central
    const newIdx = Math.round(s4_offset / stepY);
    if (newIdx !== s4_currentIdx && newIdx >= 0 && newIdx < s4_cards.length) {
      const dt = millis() - s4_lastSwitchTime;
      const theme = s4_cards[s4_currentIdx].theme;
      profile.feedTimes[theme] = (profile.feedTimes[theme] || 0) + dt;
      s4_currentIdx = newIdx;
      s4_lastSwitchTime = millis();
      playFeedTick(s4_cards[newIdx].theme);
      const themeBias = DATA.feedThemes[theme]?.pan || 0;
      currentPan = constrain(currentPan + themeBias * 0.08, -1, 1);
      applyPan();
    }

    drawSectionTag("04");
    noStroke(); textAlign(CENTER, CENTER);
    fill(255, 110); setText(0.013);
    text("desliza para cima", vw / 2, vh * 0.13);

    // após 25 segundos, avançar
    // step recalc para o threshold de avanço
    if (sectionTimer > 25000) {
      // contabilizar tempo no card actual
      const dt = millis() - s4_lastSwitchTime;
      const theme = s4_cards[s4_currentIdx].theme;
      profile.feedTimes[theme] = (profile.feedTimes[theme] || 0) + dt;
      // descobrir dominant
      let dom = null, max = -1;
      for (const k of Object.keys(profile.feedTimes)) {
        if (profile.feedTimes[k] > max) { max = profile.feedTimes[k]; dom = k; }
      }
      profile.feedBias = dom;
      s4_phase = 'reveal';
      s4_revealT = 0;
    }
  } else {
    s4_revealT += deltaTime;
    const cx = vw / 2, cy = vh / 2;
    const total = Object.values(profile.feedTimes).reduce((a, b) => a + b, 0) || 1;
    const dom = profile.feedBias;
    const pct = Math.round((profile.feedTimes[dom] / total) * 100);
    const themeLabel = DATA.feedThemes[dom].label;
    const a = min(255, s4_revealT * 0.6);

    drawSectionTag("04");

    noStroke(); textAlign(CENTER, CENTER);
    fill(255, a * 0.7); setText(0.015);
    text("do teu tempo em conteúdo", cx, cy - ts(0.12));

    fill(255, a); setText(0.12);
    textStyle(BOLD);
    text(pct + "%", cx, cy);
    textStyle(NORMAL);

    fill(255, a); setText(0.022, 0.030);
    textStyle(BOLD);
    text(themeLabel.toUpperCase(), cx - vw * 0.4, cy + ts(0.10), vw * 0.8, ts(0.10));
    textStyle(NORMAL);

    if (s4_revealT > 1800) canAdvance = true;
  }
}

function handleSec4Drag(x, y, dx, dy) {
  if (s4_phase !== 'scroll') return;
  const stepY = vh * 0.62 * 0.95;
  s4_targetOffset = constrain(s4_targetOffset - dy, 0, (s4_cards.length - 1) * stepY);
}

// ============================================================
// SECÇÃO 5 · A LINHA  (6 afirmações)
// ============================================================

let s5_idx = 0;
let s5_pos = 0.5;       // posição actual do ponto 0..1
let s5_dragging = false;
let s5_answered = false;
let s5_revealT = 0;
let s5_phase = 'asking'; // asking | summary
let s5_summaryT = 0;

function initSec5() {
  s5_idx = 0;
  s5_pos = 0.5;
  s5_dragging = false;
  s5_answered = false;
  s5_revealT = 0;
  s5_phase = 'asking';
  s5_summaryT = 0;
  profile.agreements = [];
  profile.conservativeScore = 0;
}

function drawSec5() {
  if (s5_phase === 'asking') drawSec5Ask();
  else drawSec5Summary();
}

function drawSec5Ask() {
  const stmt = DATA.statements[s5_idx];
  const cx = vw / 2;
  const lineY = vh * 0.66;
  const lineX1 = vw * 0.14, lineX2 = vw * 0.86;

  drawSectionTag("05 · " + (s5_idx + 1) + "/" + DATA.statements.length);

  // afirmação centrada com wrap
  noStroke();
  textAlign(CENTER, CENTER);
  fill(255, 230);

function handleSec5Press(x, y) {

    const lineX1 = vw * 0.14, lineX2 = vw * 0.86;

}
function handleSec5Drag(x, y) {
  if (!s5_dragging) return;

  s5_pos = constrain(map(x, lineX1, lineX2, 0, 1), 0, 1);
}
function handleSec5Release() {
  if (s5_phase !== 'asking' || s5_answered || !s5_dragging) return;
  s5_dragging = false;
  if (s5_pos === 0.5) return; // não respondeu
  profile.agreements.push(s5_pos);
  const stmt = DATA.statements[s5_idx];
  // se concorda (>0.5) e afirmação é conservadora -> +1
  // se discorda (<0.5) e afirmação é progressista -> +1
  const agreed = s5_pos > 0.55;
  const disagreed = s5_pos < 0.45;
  if (stmt.conservative && agreed) profile.conservativeScore++;
  if (!stmt.conservative && disagreed) profile.conservativeScore++;
  s5_answered = true;
  playAgreementChord(stmt.conservative, agreed);
  updatePanFromProfile();
}

function computeMatchPct(stmt, a) {
  // fictício: quanto mais próximo do meio do agrupamento dominante
  const base = stmt.conservative ? 38 : 42;
  const dev = abs(a - (stmt.conservative ? 0.75 : 0.25));
  return Math.max(8, Math.round(base - dev * 30));
}

function computeCluster() {
  // vector do utilizador
  const u = {
    qx: profile.quadrant.x,
    qy: profile.quadrant.y,
    male: profile.gender === 'M' ? 1 : 0,
    region: profile.regionIdx !== null ? DATA.regions[profile.regionIdx].chega / 30 : 0.5,
    feed: feedBiasScore(profile.feedBias),
    cons: profile.conservativeScore / DATA.statements.length
  };

  let bestIdx = 0, bestScore = -1;
  for (let i = 0; i < DATA.clusters.length; i++) {
    const c = DATA.clusters[i].vector;
    // similaridade ponderada
    let s = 0;
    s += 1 - abs(u.qx - c.qx) * 0.5;
    s += 1 - abs(u.qy - c.qy) * 0.5;
    s += 1 - abs(u.male - c.male) * 0.8;
    s += 1 - abs(u.region - c.region) * 0.4;
    s += 1 - abs(u.feed - c.feed) * 0.6;
    s += 1 - abs(u.cons - c.cons) * 0.9;
    if (s > bestScore) { bestScore = s; bestIdx = i; }
  }
  profile.clusterIdx = bestIdx;
  // mapear bestScore (0..~6) para 35..92%
  profile.clusterMatch = Math.round(constrain(map(bestScore, 2, 6, 35, 92), 30, 95));
}

function feedBiasScore(bias) {
  if (!bias) return 0.5;
  return DATA.feedThemes[bias]?.score ?? 0.5;
}

// ============================================================
// INPUT — unificado, com viewport coords
// ============================================================

let dragLastX = 0, dragLastY = 0;
let isPressed = false;

function getVP(x, y) { return { x: x - vx, y: y - vy }; }

function mousePressed() { handlePress(mouseX, mouseY); }
function mouseDragged() { handleDrag(mouseX, mouseY); }
function mouseReleased() { handleRelease(mouseX, mouseY); }
function touchStarted() {
  if (touches.length > 0) handlePress(touches[0].x, touches[0].y);
  return false;
}
function touchMoved() {
  if (touches.length > 0) handleDrag(touches[0].x, touches[0].y);
  return false;
}
function touchEnded() { handleRelease(dragLastX + vx, dragLastY + vy); return false; }

function handlePress(x, y) {
  const p = getVP(x, y);
  if (p.x < 0 || p.y < 0 || p.x > vw || p.y > vh) return;
  isPressed = true;
  dragLastX = p.x; dragLastY = p.y;

  // toca para continuar
  if (canAdvance && section >= 1 && section <= 8) {
    const hintY = vh - 44;
    if (abs(p.y - hintY) < 30 || (p.y > vh - 60)) {
      canAdvance = false;
      nextSection();
      return;
    }
  }

  switch (section) {
    case 0: handleStartClick(p.x, p.y); break;
    case 1: handleSec1Press(p.x, p.y); break;
    case 2: handleSec2Click(p.x, p.y); break;
    case 3: handleSec3Click(p.x, p.y); break;
    case 4: /* scroll handled in drag */ break;
    case 5: handleSec5Press(p.x, p.y); break;
    case 6: handleSec6Press(p.x, p.y); break;
  }
}

function handleDrag(x, y) {
  if (!isPressed) return;
  const p = getVP(x, y);
  const dx = p.x - dragLastX;
  const dy = p.y - dragLastY;
  dragLastX = p.x; dragLastY = p.y;
  switch (section) {
    case 1: handleSec1Drag(p.x, p.y); break;
    case 4: handleSec4Drag(p.x, p.y, dx, dy); break;
    case 5: handleSec5Drag(p.x, p.y); break;
    case 6: handleSec6Drag(p.x, p.y); break;
  }
}

function handleRelease(x, y) {
  if (!isPressed) return;
  isPressed = false;
  switch (section) {
    case 1: handleSec1Release(); break;
    case 5: handleSec5Release(); break;
    case 6: handleSec6Release(); break;
  }
}

// ============================================================
// AUDIO
// ============================================================

let reverbBus, reverbReturn;

function ensureAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.6;
    panNode = audioCtx.createStereoPanner();
    panNode.pan.value = 0;
    masterGain.connect(panNode);
    panNode.connect(audioCtx.destination);

    // bus de reverb feito por cadeia de delays com feedback
    reverbBus = audioCtx.createGain();
    reverbBus.gain.value = 1.0;
    const delay1 = audioCtx.createDelay(2);
    delay1.delayTime.value = 0.13;
    const delay2 = audioCtx.createDelay(2);
    delay2.delayTime.value = 0.27;
    const delay3 = audioCtx.createDelay(2);
    delay3.delayTime.value = 0.41;
    const fb = audioCtx.createGain();
    fb.gain.value = 0.55;
    const tone = audioCtx.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = 1800; tone.Q.value = 0.5;
    reverbReturn = audioCtx.createGain();
    reverbReturn.gain.value = 0.45;
    reverbBus.connect(delay1);
    delay1.connect(delay2);
    delay2.connect(delay3);
    delay3.connect(fb);
    fb.connect(delay1);
    delay3.connect(tone);
    tone.connect(reverbReturn);
    reverbReturn.connect(masterGain);
  } catch (e) {}
}

function sendToReverb(node) {
  if (reverbBus) node.connect(reverbBus);
}

// drones com frequências variáveis — usados para mudar "intenção" da música
function startAmbient() {
  if (!audioCtx || ambientOn) return;
  ambientOn = true;
  // bed harmónico discreto (só dá corpo, não é o protagonista)
  const layers = [
    { f: 55.00, g: 0.06, type: 'sine' },     // A1 sub
    { f: 110.00, g: 0.05, type: 'sine' },    // A2
    { f: 164.81, g: 0.03, type: 'sine' }     // E3
  ];
  layers.forEach(L => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 500; filter.Q.value = 0.6;
    osc.type = L.type; osc.frequency.value = L.f;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(L.g, audioCtx.currentTime + 4);
    osc.connect(filter); filter.connect(g); g.connect(masterGain);
    sendToReverb(g);
    osc.start();
    drones.push({ osc, g, filter, baseFreq: L.f, baseGain: L.g });
  });

  // piano contínuo estilo Nyman
  startPiano();
}

// ============================================================
// PIANO — síntese aditiva + scheduler de ostinato + melodia
// Estilo Michael Nyman / "The Piano", Lá menor
// ============================================================

const PIANO_NOTES = {
  A1: 55.00, E2: 82.41, A2: 110.00, C3: 130.81, E3: 164.81, F3: 174.61, G3: 196.00,
  A3: 220.00, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
  A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
  A5: 880.00
};

// nota de piano por síntese aditiva
function playPianoNote(freq, peakVol, duration, when, panOffset) {
  if (!audioCtx) return;
  const t = (when !== undefined) ? when : audioCtx.currentTime;
  const dur = duration || 2.2;
  const v = peakVol;

  // pan opcional por nota (estéreo natural)
  const p = audioCtx.createStereoPanner();
  p.pan.value = panOffset || 0;
  p.connect(masterGain);
  sendToReverb(p);

  // 4 parciais (1, 2, 3, 4) com gains decrescentes — timbre de corda
  const partials = [
    { mult: 1,    gain: 1.00, decay: 1.0 },
    { mult: 2,    gain: 0.45, decay: 0.7 },
    { mult: 3,    gain: 0.22, decay: 0.5 },
    { mult: 4.01, gain: 0.10, decay: 0.4 }
  ];
  partials.forEach(par => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = freq * par.mult;
    const peak = v * par.gain;
    const noteDur = dur * par.decay;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + 0.006);     // attack rápido
    g.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.18); // queda inicial
    g.gain.exponentialRampToValueAtTime(0.0001, t + noteDur);   // sustain longo
    o.connect(g); g.connect(p);
    o.start(t); o.stop(t + noteDur + 0.05);
  });

  // pequeno "click" do martelo (ruído filtrado)
  const noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;
  const ng = audioCtx.createGain();
  ng.gain.value = v * 0.08;
  const nf = audioCtx.createBiquadFilter();
  nf.type = 'bandpass'; nf.frequency.value = freq * 4; nf.Q.value = 4;
  noise.connect(nf); nf.connect(ng); ng.connect(p);
  noise.start(t);
}

// === SCHEDULER ===
// O piano corre em compasso 4/4. Em cada beat dispara:
//  - ostinato (mão esquerda) em colcheias
//  - melodia (mão direita) com notas longas
// Velocidade e densidade variam por secção.

let pianoOn = false;
let pianoBeat = 0;          // contador de semínimas
let pianoBPM = 70;          // base lenta
let pianoVolume = 0.18;     // base — escalada por mood
let melodyDensity = 0.55;   // 0..1 prob de tocar melodia em cada compasso

// padrões de ostinato (índices em escala de Lá menor) — repete-se em 4 beats
// Notas em colcheias (8 por compasso). Inspiração: arpejos de Am.
const OSTINATO_PATTERNS = [
  // arpejo Am simples: A C E A · E C A E
  ["A3","C4","E4","A4","E4","C4","A3","E4"],
  // mais distante: A E C E · D F E A
  ["A3","E4","C4","E4","D4","F4","E4","A3"],
  // suspense: A G F E · D F E A
  ["A3","G4","F4","E4","D4","F4","E4","A4"]
];

// frases melódicas (em A minor) — uma nota por semínima, null = silêncio
const MELODY_LINES = [
  ["A4", null, "G4", null, "F4", null, "E4", null],
  ["E5", null, "D5", null, "C5", null, "B4", null],
  ["C5", null, "B4", "A4", null, "G4", "F4", null],
  ["A4", "B4", "C5", null, "B4", "A4", "G4", null],
  ["D5", null, "C5", "B4", "A4", null, null, null]
];

let currentOstinato = OSTINATO_PATTERNS[0];
let currentMelody   = MELODY_LINES[0];
let melodyActive    = true;

function startPiano() {
  if (pianoOn) return;
  pianoOn = true;
  pianoBeat = 0;
  scheduleNextBeat();
}

function scheduleNextBeat() {
  if (!pianoOn || !audioCtx) return;
  const secondsPerBeat = 60 / pianoBPM;
  const t = audioCtx.currentTime + 0.05; // pequeno look-ahead

  // posição dentro do compasso (0..3)
  const beatInBar = pianoBeat % 4;
  // 2 colcheias do ostinato neste beat (índices 0..7)
  const o1Idx = beatInBar * 2;
  const o2Idx = beatInBar * 2 + 1;

  // ostinato (mão esquerda) — pan ligeiramente à esquerda
  const ostV = pianoVolume * 0.55;
  const f1 = PIANO_NOTES[currentOstinato[o1Idx]];
  const f2 = PIANO_NOTES[currentOstinato[o2Idx]];
  if (f1) playPianoNote(f1, ostV, secondsPerBeat * 1.5, t, -0.15);
  if (f2) playPianoNote(f2, ostV * 0.85, secondsPerBeat * 1.2, t + secondsPerBeat / 2, -0.15);

  // baixo (root) no beat 1 do compasso — peso
  if (beatInBar === 0) {
    const root = PIANO_NOTES.A2;
    playPianoNote(root, pianoVolume * 1.2, secondsPerBeat * 4, t, -0.3);
  }
  // quinta no beat 3 — empurra
  if (beatInBar === 2) {
    playPianoNote(PIANO_NOTES.E2, pianoVolume * 0.9, secondsPerBeat * 2, t, -0.3);
  }

  // melodia (mão direita) — uma nota por beat
  if (melodyActive && currentMelody[beatInBar]) {
    const mf = PIANO_NOTES[currentMelody[beatInBar]];
    if (mf) playPianoNote(mf, pianoVolume * 1.4, secondsPerBeat * 2.5, t, 0.20);
  }

  // ao terminar o compasso: escolher novos padrões probabilisticamente
  if (beatInBar === 3) {
    if (Math.random() < 0.35) currentOstinato = OSTINATO_PATTERNS[Math.floor(Math.random() * OSTINATO_PATTERNS.length)];
    if (Math.random() < melodyDensity) {
      currentMelody = MELODY_LINES[Math.floor(Math.random() * MELODY_LINES.length)];
      melodyActive = true;
    } else {
      melodyActive = false; // compasso só com ostinato — respira
    }
  }

  pianoBeat++;
  setTimeout(scheduleNextBeat, secondsPerBeat * 1000);
}

// força global (0..1)
function setMusicIntensity(v) {
  if (!ambientOn) return;
  drones.forEach((d, i) => {
    const target = d.baseGain * (0.6 + v * 1.8);
    d.g.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 1.2);
  });
}

// adiciona/remove tensão (desafinação)
function setMusicTension(t) {
  if (!ambientOn) return;
  drones.forEach((d, i) => {
    // i=1 (G2) sobe até G#/A flat conforme tensão; i=2 (C3) desce
    let delta = 0;
    if (i === 1) delta = t * 4;   // até +4Hz
    if (i === 2) delta = -t * 6;  // até -6Hz
    d.osc.frequency.linearRampToValueAtTime(d.baseFreq + delta, audioCtx.currentTime + 1.5);
  });
}

function fadeDrones(targetGain) {
  if (!ambientOn) return;
  drones.forEach(d => d.g.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 1));
}

function applyPan() {
  if (!panNode) return;
  panNode.pan.linearRampToValueAtTime(currentPan, audioCtx.currentTime + 0.5);
}

function updatePanFromProfile() {
  let v = profile.quadrant.x * 0.4;
  if (profile.conservativeScore) v += (profile.conservativeScore / 6) * 0.5;
  currentPan = constrain(v, -1, 1);
  applyPan();
  // intensidade cresce com polarização
  const pol = abs(currentPan);
  setMusicIntensity(0.3 + pol * 0.7);
  setMusicTension(pol * 0.8);
}

function setSectionMood(sec) {
  if (!ambientOn) return;
  // bed (drones) ténue só dá corpo
  const moods = {
    1: 0.55, 2: 0.60, 3: 0.70, 4: 0.95, 5: 1.10, 6: 1.25, 7: 0.80, 8: 0.55
  };
  const tens = { 1: 0, 2: 0, 3: 0.1, 4: 0.4, 5: 0.6, 6: 0.9, 7: 0.5, 8: 0.2 };

  // piano: volume + BPM + densidade melódica por secção
  const piano = {
    1: { vol: 0.16, bpm: 60, density: 0.35 },  // contemplativo
    2: { vol: 0.17, bpm: 62, density: 0.40 },
    3: { vol: 0.19, bpm: 66, density: 0.55 },  // expansivo
    4: { vol: 0.22, bpm: 76, density: 0.70 },  // feed - mais inquieto
    5: { vol: 0.24, bpm: 72, density: 0.80 },  // linha - confronto
    6: { vol: 0.27, bpm: 80, density: 0.95 },  // tempo - épico
    7: { vol: 0.18, bpm: 58, density: 0.50 },  // espelho - reflexivo
    8: { vol: 0.13, bpm: 56, density: 0.35 }   // números - esvazia
  };
  if (sec in moods) setMusicIntensity(moods[sec]);
  if (sec in tens)  setMusicTension(tens[sec]);
  if (sec in piano) {
    pianoVolume   = piano[sec].vol;
    pianoBPM      = piano[sec].bpm;
    melodyDensity = piano[sec].density;
  }
}

// secção 5: acorde consonante para progressista, dissonante para conservadora
function playAgreementChord(conservative, agreed) {
  if (!audioCtx) return;
  const aligned = (conservative && agreed) || (!conservative && !agreed);
  if (aligned) {
    // dissonância (tritono + nona b) — peso
    [130.81, 261.63, 369.99, 415.30].forEach((f, i) => envSine(f, 0.18, 1.6, i * 0.03, 'triangle'));
  } else {
    // consonância (perfeita)
    [130.81, 261.63, 329.63, 392.00, 523.25].forEach((f, i) => envSine(f, 0.15, 1.6, i * 0.03));
  }
}
function playYearTone(year) {
  if (!audioCtx) return;
  const map2015 = { 2015: 392, 2017: 440, 2019: 392, 2020: 349.23, 2021: 329.63, 2022: 311.13, 2024: 261.63 };
  envSine(map2015[year] || 392, 0.18, 1.0);
  // sub bass acompanha
  envSine((map2015[year] || 392) / 4, 0.14, 1.2, 0, 'triangle');
}
function playNumberTone(idx) {
  if (!audioCtx) return;
  const freqs = [196, 220, 246.94, 207.65, 174.61, 130.81];
  envSine(freqs[idx] || 196, 0.22, 2.4, 0, 'triangle');
  envSine((freqs[idx] || 196) * 2, 0.12, 2.4, 0, 'sine');
}

function envSine(freq, peak, dur, delay, wave) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + (delay || 0);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = wave || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + Math.min(0.05, dur * 0.15));
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(masterGain);
  sendToReverb(g);
  o.start(t); o.stop(t + dur + 0.1);
}
